[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "birdnetpy"
description = "A lightweight Python library for identifying bird species from live audio or pre-recorded files using the BirdNET model."
dynamic = ["version"]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9,<3.14"
authors = [{name="Simon Holliday", email="simon.holliday@protonmail.com"}]
keywords = ["birdnet", "bird", "species", "identification", "bioacoustics", "ornithology", "wildlife", "audio", "sound", "detection", "tflite", "machine-learning", "conservation", "ecology", "raven", "audacity"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Science/Research",
	"Topic :: Scientific/Engineering :: Bio-Informatics",
	"Topic :: Multimedia :: Sound/Audio :: Analysis",
]

dependencies = [
	"librosa",
	"numba",
	"numpy<2",
	"scipy",
	"sounddevice",
	"soundfile",
	"ai-edge-litert",
]

[project.optional-dependencies]
dev = [
	"mypy==1.15.0",
	"pytest",
]

[project.scripts]
birdcatcher = "birdnetpy.cli:main"

[tool.setuptools]
package-dir = {""="src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
birdnetpy = [
	"birdnet/*.tflite",
	"birdnet/*.txt",
	"*.txt",
]

[tool.setuptools_scm]
# Version is derived automatically from git tags (e.g. v0.2.0)

[tool.mypy]
ignore_missing_imports = true

[project.urls]
Homepage = "https://github.com/simonholliday/BirdNET-Py"
Repository = "https://github.com/simonholliday/BirdNET-Py"
